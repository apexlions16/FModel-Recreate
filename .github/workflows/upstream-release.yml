name: FModel-Recreate Automated Upstream Release

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string
      ref:
        description: Verified Git ref to package
        required: true
        type: string
      upstream_sha:
        description: Source upstream FModel commit
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: upstream-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout verified integration with submodules
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve automated channel identity
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid upstream release version: $version" }

          [xml]$build = Get-Content .\Directory.Build.props
          $projectVersion = [string]($build.Project.PropertyGroup.FModelRecreateVersion | Select-Object -First 1)
          if ($projectVersion -ne $version) {
            throw "The verified integration declares $projectVersion but the workflow requested $version."
          }

          $numericVersion = "$version.0"
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric_version=$numericVersion" >> $env:GITHUB_OUTPUT
          "tag=upstream-v$version" >> $env:GITHUB_OUTPUT
          "asset=FModel-Recreate-upstream-$version-win-x64" >> $env:GITHUB_OUTPUT

      - name: Check for an existing automated upstream release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.version.outputs.tag }}' --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

      - name: Restore
        if: steps.existing.outputs.exists != 'true'
        run: dotnet restore .\FModel\FModel.csproj -r win-x64

      - name: Audit NuGet dependencies
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: dotnet list .\FModel\FModel.csproj package --vulnerable --include-transitive

      - name: Build
        if: steps.existing.outputs.exists != 'true'
        run: dotnet build .\FModel\FModel.csproj -c Release -r win-x64 --no-restore -p:ContinuousIntegrationBuild=true

      - name: Publish self-contained executable
        if: steps.existing.outputs.exists != 'true'
        run: dotnet publish .\FModel\FModel.csproj -c Release --no-restore --self-contained true -r win-x64 -f net10.0-windows -o .\artifacts\publish -p:PublishReadyToRun=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.numeric_version }} -p:AssemblyVersion=${{ steps.version.outputs.numeric_version }}

      - name: Prepare branded executable
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: Copy-Item .\artifacts\publish\FModel.exe .\artifacts\publish\FModel-Recreate.exe -Force

      - name: Verify published runtime
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $verificationRoot = Join-Path $env:RUNNER_TEMP 'FModel-Recreate-Automated-Upstream-Verification'
          Remove-Item $verificationRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $verificationRoot -Force | Out-Null

          $marker = Join-Path $verificationRoot 'runtime-verification.complete'
          $startupLog = Join-Path $verificationRoot 'startup-crash.log'
          $env:FMODEL_RECREATE_RUNTIME_MARKER = $marker
          $env:FMODEL_RECREATE_STARTUP_LOG = $startupLog

          $process = Start-Process .\artifacts\publish\FModel-Recreate.exe -ArgumentList '--verify-runtime' -PassThru
          if (!$process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Automated upstream executable did not finish runtime verification within 30 seconds.'
          }

          if ($process.ExitCode -ne 0) {
            if (Test-Path $startupLog) { Get-Content $startupLog }
            throw "Automated upstream executable failed runtime verification with exit code $($process.ExitCode)."
          }

          if (!(Test-Path $marker)) { throw 'Runtime verification marker was not created.' }

      - name: Package automated upstream build and checksum
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $name = '${{ steps.version.outputs.asset }}'
          Compress-Archive -Path .\artifacts\publish\FModel-Recreate.exe -DestinationPath ".\artifacts\$name.zip" -Force
          (Get-FileHash ".\artifacts\$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content ".\artifacts\$name.sha256"

      - name: Create automated upstream prerelease
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FModel-Recreate Automated Upstream v${{ steps.version.outputs.version }}
          target_commitish: ${{ inputs.ref }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          body: |
            **Automated upstream-update channel — not a stable release.**

            This build contains the verified integration of upstream FModel commit `${{ inputs.upstream_sha }}`. It passed protected-path policy checks, invariant checks, dependency audit, Windows build, self-contained publish, and packaged runtime verification.

            Stable `vX.Y.Z` releases are never created by this workflow. The repository owner may later promote this exact prerelease through **Actions → Promote Upstream Release**.
          files: |
            artifacts/${{ steps.version.outputs.asset }}.zip
            artifacts/${{ steps.version.outputs.asset }}.sha256
