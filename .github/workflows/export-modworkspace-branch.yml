name: Export Mod Workspace Branch

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/export-modworkspace-branch.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/ue4-mod-workspace-core'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Remove Git metadata and broken UI payload
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name .git -prune -exec rm -rf {} +
          rm -rf .automation/modworkspace-ui
          rm -f .github/workflows/apply-modworkspace-ui.yml
          rm -f .github/workflows/export-modworkspace-branch.yml

      - name: Upload complete branch source
        uses: actions/upload-artifact@v4
        with:
          name: modworkspace-branch-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
