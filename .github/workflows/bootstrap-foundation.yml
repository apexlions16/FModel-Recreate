name: Bootstrap foundation and rebrand

on:
  push:
    branches:
      - agent/foundation-rebrand

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[bootstrap-foundation]')
    runs-on: windows-latest
    steps:
      - name: Checkout branch with submodules
        uses: actions/checkout@v6
        with:
          ref: agent/foundation-rebrand
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Apply, build, commit and push
        shell: pwsh
        run: .\tools\bootstrap-foundation.ps1
