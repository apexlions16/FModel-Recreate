name: Bootstrap foundation and rebrand

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[bootstrap-foundation]')
    runs-on: windows-latest
    steps:
      - name: Checkout dev with submodules
        uses: actions/checkout@v6
        with:
          ref: dev
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Apply and validate
        id: apply
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            .\tools\bootstrap-foundation.ps1 *>&1 | Tee-Object -FilePath bootstrap-output.log
          }
          catch {
            $_ | Out-String | Tee-Object -FilePath bootstrap-output.log -Append
            exit 1
          }

      - name: Publish bootstrap diagnostics
        if: steps.apply.outcome == 'failure'
        shell: pwsh
        run: |
          $log = Get-Content bootstrap-output.log -Raw
          git reset --hard HEAD
          git clean -fd -e bootstrap-output.log
          @"
          # Foundation bootstrap failure

          The one-shot bootstrap failed on GitHub Actions. The captured output follows.

          ````text
          $log
          ````
          "@ | Set-Content BOOTSTRAP_FAILURE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BOOTSTRAP_FAILURE.md
          git commit -m 'record foundation bootstrap failure'
          git push origin HEAD

      - name: Fail workflow when bootstrap failed
        if: steps.apply.outcome == 'failure'
        shell: pwsh
        run: throw 'Foundation bootstrap failed. See BOOTSTRAP_FAILURE.md on dev.'
