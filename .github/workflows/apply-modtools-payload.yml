name: Apply Mod Tools Payload

on:
  pull_request:
    branches: [dev]
    paths:
      - '.automation/modtools-payload/**'
      - '.github/workflows/apply-modtools-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ue4-mod-workspace-core' && github.actor == 'apexlions16'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify payload bytes and archive
        shell: bash
        run: |
          set -euo pipefail
          find .automation/modtools-payload -maxdepth 1 -type f -name 'chunk-*' -printf '%f %s\n' | sort
          CHUNK_COUNT=$(find .automation/modtools-payload -maxdepth 1 -type f -name 'chunk-*' | wc -l)
          [[ "$CHUNK_COUNT" -eq 8 ]]
          cat .automation/modtools-payload/chunk-* | base64 -d > /tmp/modtools-payload.tar.gz
          [[ $(wc -c < /tmp/modtools-payload.tar.gz) -eq 25240 ]]
          echo 'ad8681d3d0d1db18819572e57f0f8fd9a9cdb847019f94b32c84c26e501d7e3e  /tmp/modtools-payload.tar.gz' | sha256sum -c -
          tar -tzf /tmp/modtools-payload.tar.gz | tee /tmp/modtools-payload-files.txt

      - name: Extract non-workflow source payload
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/qa.yml /tmp/original-qa.yml
          tar -xzf /tmp/modtools-payload.tar.gz -C .
          cp .github/workflows/qa.yml /tmp/modtools-qa.yml
          cp /tmp/original-qa.yml .github/workflows/qa.yml

          test -f FModel.ModTools/FModel.ModTools.csproj
          test -f FModel.ModTools.Tests/FModel.ModTools.Tests.csproj
          test -f FModel.ModTools/LocResCodec.cs
          test -f FModel.ModTools.Tests/BackendTests.cs
          cmp .github/workflows/qa.yml /tmp/original-qa.yml
          rm -rf .automation/modtools-payload

      - name: Commit and push actual source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fmodel-recreate-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add tested UE4 mod tools core'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload deferred QA workflow
        uses: actions/upload-artifact@v4
        with:
          name: modtools-qa-workflow-${{ github.sha }}
          path: /tmp/modtools-qa.yml
          if-no-files-found: error
          retention-days: 1
