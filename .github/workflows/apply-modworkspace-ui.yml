name: Apply Mod Workspace UI Payload

on:
  pull_request:
    branches: [dev]
    paths:
      - '.automation/modworkspace-ui/**'
      - '.github/workflows/apply-modworkspace-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ue4-mod-workspace-core' && github.actor == 'apexlions16'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Decode and validate archive
        shell: bash
        run: |
          set -euo pipefail
          CHUNK_COUNT=$(find .automation/modworkspace-ui -maxdepth 1 -type f -name 'chunk-*' | wc -l)
          [[ "$CHUNK_COUNT" -eq 1 ]]
          cat .automation/modworkspace-ui/chunk-* | base64 -d > /tmp/modworkspace-ui.tar.gz
          tar -tzf /tmp/modworkspace-ui.tar.gz > /tmp/archive-files.txt
          [[ -s /tmp/archive-files.txt ]]

      - name: Extract and verify every source file
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/modworkspace-ui.tar.gz -C .
          cat > /tmp/expected-sha256.txt <<'HASHES'
          b322ec39db098a0bd7efc53ce1c2d03ecc0984814eb20ebb81259859ad716252  FModel/App.xaml.cs
          6f97eac994340db7ec8fc4f223ca165d96fe28f4849b358f50a8b2d15cd9a450  FModel/AppPaths.cs
          c796c48cc263b86c85300b2215801d9af96543b01c4195ced40e2c4b105ef4ec  FModel/Localization/LocalizationCatalog.cs
          a8c4f27c154f8a5d49d7e46977e0a21bd5397e9c409259f5e9432b1e73d654bb  FModel/MainWindow.xaml
          e27d506c3c8168dcd88ab8b0b9abc3f25a24d114713d19b704cee9072d07e511  FModel/Services/ApplicationService.cs
          d3384ed9312fd96e9906e672b02385bea200c19767023a1f37b7ad71034e3be2  FModel/Services/ModWorkspaceService.cs
          3cbcb296131ea0cd82d55c046b09fc9f302f17e40c8ed720bb8a4ff8ed7e058b  FModel/ViewModels/Commands/MenuCommand.cs
          095696a450a3cbdca869f433b527462f23d05bd5bc875c8872a0550aaca2a0ae  FModel/ViewModels/Commands/RightClickMenuCommand.cs
          cc59abb42064ab865a44a95303ca7ce8f177a4c481c1d047e38c91956a89610f  FModel/ViewModels/ModWorkspaceViewModel.cs
          0579af7157a7d74fbb5561fe557c0c5828e4b22d449d2d8c2ea285b3f8f17954  FModel/Views/LocResEditor.xaml
          752662b22ce6eeb718ad475452b1df988272fa12075f6d814e2d3a55be805390  FModel/Views/LocResEditor.xaml.cs
          7ad6bb443da15e245e75900ecd8623cc1edd3b3c30bab801335f9c637b67fbf4  FModel/Views/ModWorkspace.xaml
          89728b6cb415584e2e79632ef5cdc519dfce497b113904d4eb5e4f9c22ff9864  FModel/Views/ModWorkspace.xaml.cs
          4667d3fc11b81bf57aa1aad7c822a01c847afe1e7a76cd8cc153e2dab269dc4d  FModel/Views/Resources/Controls/ContextMenus/FileContextMenu.xaml
          f70f2c8852cccd08b63bac73a94a71a8a20c613f8b2d5a30812292d6066774aa  FModel/Views/TextPromptDialog.xaml
          add9278e9914ba071ffc5e2211071bc1141188377d13405b576c420c0928a2d2  FModel/Views/TextPromptDialog.xaml.cs
          89078af128bb0fbdd96fdf22bad9be72d4595b2e655632891ae2fea2ba0a0ea9  MOD_WORKSPACE.md
          3153c627595b0e49fdb66f394f33c544097c3d21a1df380e9ea3c8c4ce98b17a  README.md
          HASHES
          sha256sum -c /tmp/expected-sha256.txt
          rm -rf .automation/modworkspace-ui

          cat > /tmp/expected-changes.txt <<'FILES'
          FModel/App.xaml.cs
          FModel/AppPaths.cs
          FModel/Localization/LocalizationCatalog.cs
          FModel/MainWindow.xaml
          FModel/Services/ApplicationService.cs
          FModel/Services/ModWorkspaceService.cs
          FModel/ViewModels/Commands/MenuCommand.cs
          FModel/ViewModels/Commands/RightClickMenuCommand.cs
          FModel/ViewModels/ModWorkspaceViewModel.cs
          FModel/Views/LocResEditor.xaml
          FModel/Views/LocResEditor.xaml.cs
          FModel/Views/ModWorkspace.xaml
          FModel/Views/ModWorkspace.xaml.cs
          FModel/Views/Resources/Controls/ContextMenus/FileContextMenu.xaml
          FModel/Views/TextPromptDialog.xaml
          FModel/Views/TextPromptDialog.xaml.cs
          MOD_WORKSPACE.md
          README.md
          FILES
          git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | grep -v '^\.github/workflows/apply-modworkspace-ui.yml$' | sort > /tmp/actual-changes.txt
          diff -u /tmp/expected-changes.txt /tmp/actual-changes.txt

      - name: Commit and push actual UI source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fmodel-recreate-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add FModel Mod Workspace interface'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
